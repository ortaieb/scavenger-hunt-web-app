name: PR Build

# Runs on every PR touching any branch, and re-runs on each new push to the
# PR (synchronize) — a fresh GitHub-hosted runner plus `npm ci` against the
# lockfile gives the "clean start" a Node project needs; there's no
# venv-equivalent isolation step required.
on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - '**'

# Superseded runs (e.g. a force-push or another `synchronize`) are cancelled
# rather than left to finish, so CI minutes aren't wasted on stale commits.
concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
