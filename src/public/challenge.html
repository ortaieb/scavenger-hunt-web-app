<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Scavenger Hunt — Challenge</title>
    <link rel="stylesheet" href="/challenge.css" />
  </head>
  <body>
    <main class="challenge">
      <h1>Capture your challenge</h1>
      <p id="status" class="status" role="status">Starting camera…</p>

      <fieldset class="identity">
        <legend>Your details</legend>
        <label for="session-input">Session ID</label>
        <input id="session-input" type="text" autocomplete="off" spellcheck="false" />
        <label for="participant-input">Participant ID</label>
        <input id="participant-input" type="text" autocomplete="off" spellcheck="false" />
      </fieldset>

      <section id="challenge-panel" class="challenge-panel" hidden>
        <h2>Your challenge</h2>
        <p id="challenge-pose"></p>
      </section>

      <div class="camera-frame">
        <video id="preview" autoplay playsinline muted></video>
        <canvas id="snapshot" hidden></canvas>
        <img id="photo" alt="Captured photo" hidden />
      </div>

      <div class="controls">
        <button id="capture" type="button">Take photo</button>
        <button id="retake" type="button" hidden>Retake</button>
        <button id="submit" type="button" hidden>Submit</button>
      </div>

      <dl class="location">
        <dt>Location</dt>
        <dd id="location">Not captured yet</dd>
      </dl>
      <p id="location-warning" class="location-warning" role="status" hidden></p>
    </main>

    <script type="module" src="/challenge.js"></script>
  </body>
</html>
